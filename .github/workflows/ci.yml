name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CRYSTAL_RUBY_SINGLE_THREAD_MODE: "1"
      RESET_CRYSTALRUBY_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - run: bundle exec rake test
