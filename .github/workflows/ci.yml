name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CRYSTAL_RUBY_SINGLE_THREAD_MODE: "1"
      RESET_CRYSTALRUBY_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - run: bundle exec rake test
      - run: sudo apt-get update && sudo apt-get install -y libjemalloc2
        if: runner.os == 'Linux'
      - name: Test with the preloaded process allocator
        if: runner.os == 'Linux'
        run: bundle exec rake test
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
